server:
  port: 8095
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  application:
    name: notification-service
  main:
    web-application-type: servlet

notification:
  email:
    from: ${NOTIFICATION_EMAIL_FROM:noreply@localhost}
    to: ${NOTIFICATION_EMAIL_TO:parent@example.com}

app:
  rabbitmq:
    exchange: payment.events
    routing-key: payment.received
    queue: payment.notification.queue

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
