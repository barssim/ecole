server:
  port: 8085
  address: 0.0.0.0

spring:
  profiles:
    active: prod   # change to production

  main:
    web-application-type: reactive

  cloud:
    gateway:

      globalcors:
        corsConfigurations:
          '[/**]':
            # Exact origins (no wildcard – required when allowCredentials is true)
            allowedOrigins:
              - "http://ecole-portal"
              - "http://ecole-portal:80"
              - "http://ecole-portal-dev:8080"
              - "http://ecole-portal-test:8081"
              - "http://v95566.1blu.de"
              - "http://v95566.1blu.de:80"
              - "https://v95566.1blu.de"
              - "http://www.v95566.1blu.de"
              - "https://www.v95566.1blu.de"
              - "http://localhost"
              - "http://localhost:80"
              - "http://localhost:3000"
              - "http://localhost:8080"
              - "http://localhost:8081"
              - "http://127.0.0.1"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:8080"
            # Pattern-based fallback (covers sub-domains / CI environments)
            allowedOriginPatterns:
              - "http://*.1blu.de"
              - "https://*.1blu.de"
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Content-Disposition"
              - "X-Tenant-Id"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      httpclient:
        wiretap: false  # disable wiretap in prod
        connectTimeout: 30000  # 30 seconds
        responseTimeout: 60000  # 60 seconds

      httpserver:
        wiretap: false

      websocket:
        max-frame-payload-size: 100KB

      routes:

        - id: usermanagement
          uri: "http://usermanagement:8091"
          predicates:
            - Path=/api/auth/**,/api/users/**
          filters:
            - StripPrefix=0

        - id: finance-manager
          uri: "http://finance-manager:8094"
          predicates:
            - Path=/api/facture/**,/api/factures/**,/api/payments/**,/api/paymentNotice/**,/api/paymentNotices/**
          filters:
            - StripPrefix=0

        - id: secretary-office
          uri: "http://secretary-office:8095"
          predicates:
            - Path=/api/attestations,/api/attestations/**,/api/attestationsproduction,/api/attestationsproduction/**,/api/classes,/api/classes/**,/api/presence/**,/api/exams,/api/exams/**,/api/activities,/api/activities/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
