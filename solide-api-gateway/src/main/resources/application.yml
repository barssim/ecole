server:
  port: 8085
  address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET:239487234972394e98er023r934o9342oi4uew0923w8734928374}

spring:
  profiles:
    active: prod   # change to production

  main:
    web-application-type: reactive

  cloud:
    gateway:

      globalcors:
        corsConfigurations:
          '[/**]':
            # Production origins only. Keep this list explicit to prevent
            # arbitrary subdomains from gaining browser access to the API.
            allowedOrigins:
              - "https://v95566.1blu.de"
              - "https://qods.mysolide.com"
              - "https://gardinia.mysolide.com"
              - "http://gardinia.localhost:3000"
              - "http://qods.localhost:3000"
              - "http://muster.localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - X-School-Id
            exposedHeaders:
              - "Content-Disposition"
              - "X-School-Id"
            allowCredentials: false

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      httpclient:
        wiretap: false  # disable wiretap in prod
        connectTimeout: 30000  # 30 seconds
        responseTimeout: 60000  # 60 seconds

      httpserver:
        wiretap: false

      websocket:
        max-frame-payload-size: 100KB

      routes:

        - id: usermanagement
          uri: "http://usermanagement:8091"
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/school-customization,/api/school-customization/**
          filters:
            - StripPrefix=0

        - id: finance-manager
          uri: "http://finance-manager:8094"
          predicates:
            - Path=/api/facture/**,/api/factures/**,/api/payments,/api/payments/**,/api/paymentNotice,/api/paymentNotice/**,/api/paymentNotices,/api/paymentNotices/**
          filters:
            - StripPrefix=0

        - id: teacher-service
          uri: "http://teacher-service:8096"
          predicates:
            - Path=/api/teachercourses,/api/teachercourses/**,/api/upload,/api/uploads/**,/api/teacher/**,/api/presence/professors/**
          filters:
            - StripPrefix=0

        - id: student-service
          uri: "http://student-service:8097"
          predicates:
            - Path=/api/studentschedule,/api/studentschedule/**,/api/student/**
          filters:
            - StripPrefix=0

        - id: parent-service
          uri: "http://parent-service:8098"
          predicates:
            - Path=/api/parents/registration,/api/parents/registration/**,/api/parents/attendance,/api/parents/attendance/**,/api/parents/payments,/api/parents/payments/**,/api/parents/progress,/api/parents/progress/**,/api/parents/attestation-requests,/api/parents/attestation-requests/**
          filters:
            - StripPrefix=0

        - id: secretary-office
          uri: "http://secretary-office:8095"
          predicates:
            - Path=/api/attestations,/api/attestations/**,/api/attestationsproduction,/api/attestationsproduction/**,/api/classes,/api/classes/**,/api/exams,/api/exams/**,/api/activities,/api/activities/**,/api/gallery,/api/gallery/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
