server:
  port: 8098
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://mysql-parent:3306/parentDB
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  application:
    name: parent-service
  main:
    web-application-type: servlet

parent-service:
  finance:
    base-url: ${FINANCE_MANAGER_BASE_URL:http://finance-manager:8094}
  student:
    base-url: ${STUDENT_SERVICE_BASE_URL:http://student-service:8097}
  secretary-office:
    base-url: ${SECRETARY_OFFICE_BASE_URL:http://secretary-office:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

