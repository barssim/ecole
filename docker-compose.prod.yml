services:

  mysql-user:
    image: mysql:8
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: userDB
    networks:
      - ecole
    restart: always

  mysql-fin:
    image: mysql:8
    container_name: mysql-fin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: finDB
    networks:
      - ecole
    restart: always

  mysql-teacher:
    image: mysql:8
    container_name: mysql-teacher
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: teacherDB
    networks:
      - ecole

  mysql-student:
    image: mysql:8
    container_name: mysql-student
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: studentDB
    networks:
      - ecole

  mysql-parent:
    image: mysql:8
    container_name: mysql-parent
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: parentDB
    networks:
      - ecole

  mysql-secretary-office:
    image: mysql:8
    container_name: mysql-secretary-office
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dev-pass}
      MYSQL_DATABASE: secretaryOfficeDB
    networks:
      - ecole
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-dev-pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  usermanagement:
    image: barssim/usermanagement:latest
    container_name: usermanagement
    depends_on:
      - mysql-user
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/userDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/config/usermanagement/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  finance-manager:
    image: barssim/finance-manager:latest
    container_name: finance-manager
    depends_on:
      - mysql-fin
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-fin:3306/finDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/config/finance-manager/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  secretary-office:
    image: barssim/secretary-office:latest
    container_name: secretary-office
    env_file:
      - .env
    depends_on:
      mysql-secretary-office:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-secretary-office:3306/secretaryOfficeDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dev-pass}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/config/secretary-office/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  teacher-service:
    image: barssim/teacher-service:latest
    container_name: teacher-service
    depends_on:
      - mysql-teacher
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-teacher:3306/teacherDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  student-service:
    image: barssim/student-service:latest
    container_name: student-service
    depends_on:
      - mysql-student
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-student:3306/studentDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  parent-service:
    image: barssim/parent-service:latest
    container_name: parent-service
    depends_on:
      - mysql-parent
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-parent:3306/parentDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  eureka-server:
    image: barssim/eureka-server:latest
    container_name: eureka-server
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/config/eureka-server/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  api-gateway:
    image: barssim/solide_api_gateway:latest
    container_name: api-gateway
    ports:
      - "8085:8085"
    depends_on:
      - usermanagement
      - finance-manager
      - secretary-office
      - teacher-service
      - student-service
      - parent-service
      - eureka-server
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/config/api-gateway/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  ecole-portal:
    image: barssim/ecole-portal:latest
    container_name: ecole-portal
    ports:
      - "80:80"
    restart: always
    environment:
      NODE_ENV: production
      REACT_APP_API_GATEWAY_URL: http://v95566.1blu.de:8085
      REACT_APP_USE_RELATIVE_API: "false"
    networks:
      - ecole

networks:
  ecole:
