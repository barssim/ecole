services:

  mysql-user:
    image: mysql:8
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: userDB
    networks:
      - ecole
    restart: always

  mysql-fin:
    image: mysql:8
    container_name: mysql-fin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: finDB
    networks:
      - ecole
    restart: always

  mysql-secretary-office:
    image: mysql:8
    container_name: mysql-secretary-office
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dev-pass}
      MYSQL_DATABASE: secretaryOfficeDB
    networks:
      - ecole
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-dev-pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  usermanagement:
    image: barssim/usermanagement:latest
    container_name: usermanagement
    depends_on:
      - mysql-user
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/userDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/usermanagement/config/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  finance-manager:
    image: barssim/finance-manager:latest
    container_name: finance-manager
    depends_on:
      - mysql-fin
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-fin:3306/finDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/finance-manager/config/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  secretary-office:
    build:
      context: ./secretary-office
      dockerfile: Dockerfile
    image: barssim/secretary-office:latest
    container_name: secretary-office
    env_file:
      - .env
    depends_on:
      mysql-secretary-office:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-secretary-office:3306/secretaryOfficeDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dev-pass}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/secretary-office/config/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  eureka-server:
    image: barssim/eureka-server:latest
    container_name: eureka-server
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/eureka-server/config/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  api-gateway:
    build:
      context: ./solide-api-gateway
      dockerfile: Dockerfile
    image: barssim/solide_api_gateway:latest
    container_name: api-gateway
    ports:
      - "8085:8085"
    depends_on:
      - usermanagement
      - finance-manager
      - secretary-office
      - eureka-server
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - /opt/ecole/api-gateway/config/application.yml:/app/config/application.yml:ro
    networks:
      - ecole
    restart: always

  ecole-portal:
    build:
      context: ./ecole-portal
      dockerfile: Dockerfile
    image: barssim/ecole-portal:latest
    container_name: ecole-portal
    ports:
      - "80:80"
    restart: always
    environment:
      NODE_ENV: production
      REACT_APP_API_GATEWAY_URL: http://v95566.1blu.de:8085
      REACT_APP_USE_RELATIVE_API: "false"
    networks:
      - ecole

networks:
  ecole:
