server:
  port: 8096
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://mysql-teacher:3306/teacherDB
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  application:
    name: teacher-service
  main:
    web-application-type: servlet

teacher:
  attendance:
    history:
      default-days: ${TEACHER_ATTENDANCE_HISTORY_DEFAULT_DAYS:7}
      max-days: ${TEACHER_ATTENDANCE_HISTORY_MAX_DAYS:365}
  uploads:
    directory: ${TEACHER_UPLOADS_DIR:/tmp/teacher-uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:eu-west-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      presign-endpoint: ${AWS_S3_PRESIGN_ENDPOINT:}
      url-duration-minutes: ${AWS_S3_URL_DURATION_MINUTES:15}

secretary-office:
  base-url: ${SECRETARY_OFFICE_BASE_URL:http://secretary-office:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
