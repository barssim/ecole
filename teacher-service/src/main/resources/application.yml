server:
  port: 8096
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://mysql-teacher:3306/teacherDB
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  application:
    name: teacher-service
  main:
    web-application-type: servlet

teacher:
  uploads:
    directory: ${TEACHER_UPLOADS_DIR:/tmp/teacher-uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

