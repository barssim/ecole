server:
  port: 8095
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://mysql-secretary-office:3306/secretaryOfficeDB
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  application:
    name: secretary-office
  main:
    web-application-type: servlet

gallery:
  uploads:
    directory: ${GALLERY_UPLOADS_DIR:/tmp/gallery-uploads}
    s3:
      bucket: ${GALLERY_S3_BUCKET:}
      region: ${GALLERY_S3_REGION:eu-west-1}
      endpoint: ${GALLERY_S3_ENDPOINT:}
      presign-endpoint: ${GALLERY_S3_PRESIGN_ENDPOINT:}
      url-duration-minutes: ${GALLERY_S3_URL_DURATION_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
jwt:
  secret: ${JWT_SECRET:239487234972394e98er023r934o9342oi4uew0923w8734928374}
  expiration: 3600000 # 1 hour in milliseconds (optional)

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/