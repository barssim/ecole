server:
  port: 8097
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://mysql-student:3306/studentDB
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  application:
    name: student-service
  main:
    web-application-type: servlet

student:
  grades:
    max-scale: ${STUDENT_GRADES_MAX_SCALE:20}
  exercises:
    default-status: ${STUDENT_EXERCISES_DEFAULT_STATUS:pending}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

