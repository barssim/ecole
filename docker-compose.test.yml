services:

  ecole-portal:
    build:
      context: ./ecole-portal
      dockerfile: Dockerfile
      target: test
    container_name: ecole-portal-test
    ports:
      - "8081:80"
    volumes:
      - ./ecole-portal:/app
      - /app/node_modules
    networks:
      - ecole
    environment:
      - REACT_APP_API_GATEWAY_URL=http://api-gateway:8085

networks:
  ecole:

