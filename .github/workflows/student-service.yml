name: Build & Deploy student-service app

on:
  push:
    branches:
      - main
      - develop
      - test
    paths:
      - 'student-service/**'
      - '.github/workflows/student-service.yml'
      - 'docker-compose.yml'

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify pom.xml exists
        run: test -f ./student-service/pom.xml

      - name: Build with Maven
        working-directory: ./student-service
        run: mvn -B clean package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./student-service
          file: ./student-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/student-service:latest

      - name: Deploy on server via Docker Compose
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ecole

            if [ -d .git ]; then
              git pull --ff-only
            fi

            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            # ensure the Docker network used by docker-compose exists on the target host
            docker network inspect ecole >/dev/null 2>&1 || docker network create ecole

            COMPOSE_FILE="docker-compose.yml"
            if [ -f docker-compose.prod.yml ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            fi

            if ! docker compose -f "$COMPOSE_FILE" config --services | grep -qx "student-service"; then
              echo "student-service is not defined in $COMPOSE_FILE"
              exit 1
            fi

            docker compose -f "$COMPOSE_FILE" pull student-service
            docker compose -f "$COMPOSE_FILE" up -d student-service
            
            docker image prune -a -f