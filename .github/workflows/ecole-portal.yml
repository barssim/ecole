name: Build & Deploy ecole-portal app

on:
  push:
    branches:
      - main
      - develop
      - test
    paths:
      - 'ecole-portal/**'
      - '.github/workflows/ecole-portal.yml'
      - 'docker-compose.yml'

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Login Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Build & Push (TEST)
      - name: Build & Push Test Image
        if: github.ref == 'refs/heads/test'
        uses: docker/build-push-action@v5
        with:
          context: ./ecole-portal
          file: ./ecole-portal/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecole-portal:test
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecole-portal:test-${{ github.sha }}
          build-args: |
            REACT_APP_API_GATEWAY_URL=${{ secrets.REACT_APP_API_GATEWAY_URL_TEST }}
            REACT_APP_APP_VERSION=test-${{ github.sha }}
            REACT_APP_RELEASE_VERSION=0.1.0-test

      # Build & Push (DEVELOP)
      - name: Build & Push Develop Image
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v5
        with:
          context: ./ecole-portal
          file: ./ecole-portal/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecole-portal:develop
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecole-portal:develop-${{ github.sha }}
          build-args: |
            REACT_APP_API_GATEWAY_URL=${{ secrets.REACT_APP_API_GATEWAY_URL_DEV }}
            REACT_APP_APP_VERSION=develop-${{ github.sha }}
            REACT_APP_RELEASE_VERSION=0.1.0-dev

      # Build & Push (MAIN / PRODUCTION)
      - name: Build & Push Production Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./ecole-portal
          file: ./ecole-portal/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecole-portal:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecole-portal:main
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecole-portal:main-${{ github.sha }}
          build-args: |
            REACT_APP_API_GATEWAY_URL=${{ secrets.REACT_APP_API_GATEWAY_URL_PROD }}
            REACT_APP_APP_VERSION=main-${{ github.sha }}
            REACT_APP_RELEASE_VERSION=0.1.0

  deploy:
    name: Deploy to Server (main + develop + test)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/test'

    steps:
      - name: Print branch
        run: echo ${{ github.ref_name }}

      - name: Deploy on Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /home/ecole

            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "main" ]; then
              COMPOSE_FILE=docker-compose.prod.yml
            elif [ "$BRANCH" = "test" ]; then
              COMPOSE_FILE=docker-compose.test.yml
            else
              COMPOSE_FILE=docker-compose.dev.yml
            fi


            # ensure the Docker network used by docker-compose exists on the target host
            # this avoids issues where services expect a named network (e.g. `ecole`) to exist
            docker network inspect ecole >/dev/null 2>&1 || docker network create ecole

            docker compose -f "$COMPOSE_FILE" pull ecole-portal
            docker compose -f "$COMPOSE_FILE" up -d ecole-portal
            
            docker image prune -a -f