services:

  mysql-user:
    image: mysql:8
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: userDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-fin:
    image: mysql:8
    container_name: mysql-fin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: finDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-secretary-office:
    image: mysql:8
    container_name: mysql-secretary-office
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: secretaryOfficeDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-teacher:
    image: mysql:8
    container_name: mysql-teacher
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: teacherDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-student:
    image: mysql:8
    container_name: mysql-student
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: studentDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-parent:
    image: mysql:8
    container_name: mysql-parent
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: parentDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-school-activity:
    image: mysql:8
    container_name: mysql-school-activity
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: schoolActivityDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  usermanagement:
    image: barssim/usermanagement:latest
    container_name: usermanagement
    depends_on:
      mysql-user:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/userDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  finance-manager:
    image: barssim/finance-manager:latest
    container_name: finance-manager
    depends_on:
      mysql-fin:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-fin:3306/finDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - ecole

  secretary-office:
    build:
      context: ./secretary-office
      dockerfile: Dockerfile
    image: barssim/secretary-office:latest
    container_name: secretary-office
    depends_on:
      mysql-secretary-office:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-secretary-office:3306/secretaryOfficeDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - ecole

  teacher-service:
    build:
      context: ./teacher-service
      dockerfile: Dockerfile
    image: barssim/teacher-service:latest
    container_name: teacher-service
    depends_on:
      mysql-teacher:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-teacher:3306/teacherDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      TEACHER_UPLOADS_DIR: /data/teacher-uploads
    volumes:
      - teacher-uploads:/data/teacher-uploads
    networks:
      - ecole

  student-service:
    build:
      context: ./student-service
      dockerfile: Dockerfile
    image: barssim/student-service:latest
    container_name: student-service
    depends_on:
      mysql-student:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-student:3306/studentDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  parent-service:
    build:
      context: ./parent-service
      dockerfile: Dockerfile
    image: barssim/parent-service:latest
    container_name: parent-service
    depends_on:
      mysql-parent:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-parent:3306/parentDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  school-activity:
    build:
      context: ./school-activity
      dockerfile: Dockerfile
    image: barssim/school-activity:latest
    container_name: school-activity
    depends_on:
      mysql-school-activity:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-school-activity:3306/schoolActivityDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  eureka-server:
    image: barssim/eureka-server:latest
    container_name: eureka-server
    networks:
      - ecole

  api-gateway:
    build:
      context: ./solide-api-gateway
      dockerfile: Dockerfile
    image: barssim/solide_api_gateway:latest
    container_name: api-gateway
    ports:
      - "8085:8085"
    depends_on:
      - usermanagement
      - finance-manager
      - secretary-office
      - teacher-service
      - student-service
      - parent-service
      - school-activity
      - eureka-server
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - ecole

networks:
  ecole:

volumes:
  teacher-uploads: