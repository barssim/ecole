services:

  ecole-portal:
    build:
      context: ./ecole-portal
      dockerfile: Dockerfile
      target: dev
    container_name: ecole-portal-dev
    ports:
      - "3000:3000"
    volumes:
      - ./ecole-portal:/app
      - /app/node_modules
    networks:
      - ecole
    environment:
      - REACT_APP_API_GATEWAY_URL=http://api-gateway:8085
      - REACT_APP_USE_RELATIVE_API=true
      - REACT_APP_DEBUG=true
      - HOST=0.0.0.0
      - PORT=3000

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - ecole

  mysql-teacher:
    image: mysql:8
    container_name: mysql-teacher
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: teacherDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  teacher-service:
    build:
      context: ./teacher-service
      dockerfile: Dockerfile
    container_name: teacher-service
    depends_on:
      mysql-teacher:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-teacher:3306/teacherDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-ecole-course-files}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PRESIGN_ENDPOINT: ${AWS_S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    networks:
      - ecole

  mysql-user:
    image: mysql:8
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: userDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-fin:
    image: mysql:8
    container_name: mysql-fin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: finDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-secretary-office:
    image: mysql:8
    container_name: mysql-secretary-office
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: secretaryOfficeDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-student:
    image: mysql:8
    container_name: mysql-student
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: studentDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-parent:
    image: mysql:8
    container_name: mysql-parent
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: parentDB
    networks:
      - ecole
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  usermanagement:
    build:
      context: ./usermanagement
      dockerfile: Dockerfile
    container_name: usermanagement
    depends_on:
      mysql-user:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "5005:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/userDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      WELCOME_EMAIL_FROM: ${WELCOME_EMAIL_FROM:-noreply@ecole-portal.local}
      WELCOME_EMAIL_ENABLED: ${WELCOME_EMAIL_ENABLED:-true}
    networks:
      - ecole

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - ecole
    restart: always

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ecole
    restart: always

  finance-manager:
    build:
      context: ./finance-manager
      dockerfile: Dockerfile
    container_name: finance-manager
    depends_on:
      mysql-fin:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-fin:3306/finDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - ecole

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_started
      mailpit:
        condition: service_started
      mysql-user:
        condition: service_healthy
    ports:
      - "5006:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/userDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-noreply@localhost}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-parent@example.com}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    networks:
      - ecole

  secretary-office:
    build:
      context: ./secretary-office
      dockerfile: Dockerfile
    container_name: secretary-office
    depends_on:
      mysql-secretary-office:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-secretary-office:3306/secretaryOfficeDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GALLERY_S3_BUCKET: ${GALLERY_S3_BUCKET:-ecole-gallery-files}
      GALLERY_S3_REGION: ${AWS_REGION:-us-east-1}
      GALLERY_S3_ENDPOINT: http://minio:9000
      GALLERY_S3_PRESIGN_ENDPOINT: ${AWS_S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    networks:
      - ecole

  student-service:
    build:
      context: ./student-service
      dockerfile: Dockerfile
    container_name: student-service
    depends_on:
      mysql-student:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-student:3306/studentDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  parent-service:
    build:
      context: ./parent-service
      dockerfile: Dockerfile
    container_name: parent-service
    depends_on:
      mysql-parent:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-parent:3306/parentDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - ecole

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    networks:
      - ecole

  api-gateway:
    build:
      context: ./solide-api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8085"
    depends_on:
      - usermanagement
      - finance-manager
      - secretary-office
      - teacher-service
      - student-service
      - parent-service
      - eureka-server
    networks:
      - ecole

networks:
  ecole:

volumes:
  minio-data:
